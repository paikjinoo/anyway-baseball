<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Anyway Baseball">
  <!--
    maskable 전용. icon.svg와 같은 마크지만 **배경이 가장자리까지 꽉 차고 마크는 작다.**
    안드로이드가 적응형 아이콘의 바깥 20%를 원형 등으로 깎아 내므로, 같은 파일을 쓰면
    공이 잘린다. 마크를 중앙 안전지대(지름 80%) 안에 두는 것이 이 파일의 존재 이유다.
  -->
  <defs>
    <radialGradient id="ballm" cx="38%" cy="32%" r="72%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="62%" stop-color="#f2f6f0"/>
      <stop offset="100%" stop-color="#cdd8cf"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" fill="#030806"/>

  <g transform="translate(256 256) scale(0.78)">
    <circle r="150" fill="url(#ballm)"/>
    <g fill="none" stroke="#b91c1c" stroke-width="15" stroke-linecap="round">
      <path d="M-83 -104c26 39 26 91 0 130"/>
      <path d="M83 -104c-26 39-26 91 0 130"/>
    </g>
  </g>
</svg>
